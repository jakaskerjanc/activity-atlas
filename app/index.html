<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activity Atlas</title>
    <meta
      name="description"
      content="Every Strava and Garmin activity as a route on one map, with analytics on distance, climbing and consistency."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0e0f13" />
    <!-- The initial data fetch otherwise waits for the JS to execute. Start it
         with the bundle instead; Mapbox's own requests come from its chunk. -->
    <link rel="preload" href="%BASE_URL%data/routes.json" as="fetch" crossorigin />
    <link rel="preload" href="%BASE_URL%data/activities.json" as="fetch" crossorigin />
    <link rel="preconnect" href="https://api.mapbox.com" crossorigin />
    <link rel="preconnect" href="https://events.mapbox.com" crossorigin />
    <script>
      // Set the theme before first paint (saved choice, else OS preference) so the
      // panels don't flash the wrong palette. App.tsx keeps this in sync afterward.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") {
            t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
