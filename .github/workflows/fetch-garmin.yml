name: Fetch Garmin

on:
  schedule:
    - cron: "17 4 * * *"      # daily ~04:17 UTC
  workflow_dispatch:

concurrency:
  group: fetch-garmin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      db_changed: ${{ steps.fetch.outputs.db_changed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch into R2
        id: fetch
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: scripts/ci_fetch.sh

  # Nothing is committed, so nothing retriggers deploy.yml: call it directly,
  # whenever the database in R2 changed, even if the fetch job then failed
  # (exit 7 after a places-and-routes refresh failure, or a partial fetch
  # error): the uploaded database is what the site should show.
  deploy:
    needs: fetch
    if: ${{ !cancelled() && needs.fetch.outputs.db_changed == 'true' }}
    uses: ./.github/workflows/deploy.yml
    secrets:
      VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_RO_ACCESS_KEY_ID: ${{ secrets.R2_RO_ACCESS_KEY_ID }}
      R2_RO_SECRET_ACCESS_KEY: ${{ secrets.R2_RO_SECRET_ACCESS_KEY }}
    permissions:
      contents: read
      pages: write
      id-token: write
